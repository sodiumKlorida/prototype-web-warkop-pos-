<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Warkop</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 font-sans text-gray-900 flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside
        class="w-64 bg-amber-900 text-white flex flex-col transition-transform duration-300 ease-in-out hidden md:flex">
        <!-- Logo / Brand -->
        <div class="flex items-center justify-center h-16 border-b border-amber-800">
            <span class="font-bold text-xl tracking-wider">☕ WarkopKita</span>
        </div>

        <!-- Navigation Links -->
        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
            <!-- Nav Melayani Pesanan (Di-highlight agar terlihat sebagai fitur utama) -->
            <a href="pesanan.html"
                class="flex items-center px-4 py-3 text-amber-100 hover:bg-amber-800 hover:text-white rounded-lg transition-colors">
                <span class="mr-3 text-lg">🛒</span>
                <span class="font-bold">Melayani Pesanan</span>
            </a>

            <!-- Nav Kelola Menu (Aktif di halaman ini) -->
            <a href="index.html"
                class="flex items-center px-4 py-3 bg-white text-amber-900 rounded-lg shadow-md transition-colors font-bold mt-2">
                <span class="mr-3 text-lg">📋</span>
                <span>Kelola Menu</span>
            </a>

            <a href="laporan.html"
                class="flex items-center px-4 py-3 text-amber-100 hover:bg-amber-800 hover:text-white rounded-lg transition-colors">
                <span class="mr-3 text-lg">📊</span>
                <span class="font-medium">Laporan Penjualan</span>
            </a>
        </nav>

        <!-- Logout Area -->
        <div class="p-4 border-t border-amber-800">
            <a href="#" class="flex items-center px-4 py-2 text-amber-200 hover:text-white transition-colors">
                <span class="mr-3 text-lg">🚪</span>
                <span class="font-medium">Keluar</span>
            </a>
        </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="flex-1 flex flex-col overflow-hidden">

        <!-- Top Navbar -->
        <header
            class="bg-white shadow-sm border-b border-gray-200 h-16 flex items-center justify-between px-4 sm:px-6 lg:px-8">
            <div class="flex items-center">
                <h1 class="text-xl font-bold text-gray-800">Manajemen Menu</h1>
            </div>
            <div class="flex items-center gap-4">
                <div class="relative hidden sm:block">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">🔍</span>
                    <input type="text" placeholder="Cari menu..."
                        class="pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-amber-500 focus:border-amber-500 outline-none text-sm w-64">
                </div>
                <div class="border-l border-gray-300 h-6 mx-2 hidden sm:block"></div>
                <span class="text-gray-600 font-medium text-sm hidden sm:block">Halo, Admin!</span>
                <div
                    class="h-8 w-8 rounded-full bg-amber-500 flex items-center justify-center text-white font-bold cursor-pointer hover:bg-amber-600">
                    A
                </div>
            </div>
        </header>

        <!-- Main Content Area (Scrollable) -->
        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-4 sm:p-6 lg:p-8">
            <div class="flex flex-col lg:flex-row gap-8">

                <!-- Bagian Kiri: Form Input -->
                <div class="w-full lg:w-1/3">
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 sticky top-0">
                        <h2 class="text-xl font-bold text-gray-800 mb-6 border-b pb-2">Tambah Menu Baru</h2>

                        <form action="#" method="POST">
                            <!-- Input Nama Pesanan -->
                            <div class="mb-4">
                                <label for="pesanan" class="block text-sm font-medium text-gray-700 mb-2">Gambar
                                    Pesanan</label>
                                <input type="file" id="pesanan" name="pesanan" placeholder="Contoh: Es Teh Manis"
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-amber-500 focus:border-amber-500 outline-none transition-colors">
                            </div>
                            
                            <!-- Input Nama Pesanan -->
                            <div class="mb-4">
                                <label for="pesanan" class="block text-sm font-medium text-gray-700 mb-2">Nama
                                    Pesanan</label>
                                <input type="text" id="pesanan" name="pesanan" placeholder="Contoh: Es Teh Manis"
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-amber-500 focus:border-amber-500 outline-none transition-colors">
                            </div>

                            <!-- Input Tipe Pesanan -->
                            <div class="mb-6">
                                <label for="tipe" class="block text-sm font-medium text-gray-700 mb-2">Tipe
                                    Pesanan</label>
                                <select id="tipe" name="tipe"
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-amber-500 focus:border-amber-500 outline-none bg-white transition-colors">
                                    <option value="" disabled selected>Pilih tipe...</option>
                                    <option value="minuman">🥤 Minuman</option>
                                    <option value="makanan">🍜 Makanan</option>
                                    <option value="cemilan">🍟 Cemilan</option>
                                </select>
                            </div>

                            <!-- Input Harga -->
                            <div class="mb-6">
                                <label for="harga" class="block text-sm font-medium text-gray-700 mb-2">Harga
                                    (Rp)</label>
                                <input type="number" id="harga" name="harga" placeholder="Contoh: 5000"
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-amber-500 focus:border-amber-500 outline-none transition-colors">
                            </div>

                            <!-- Tombol Submit -->
                            <button type="button"
                                class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 px-4 rounded-lg transition-colors duration-200">
                                Simpan Menu
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Bagian Kanan: List Produk (Cards) -->
                <div class="w-full lg:w-2/3">
                    <h2 class="text-xl font-bold text-gray-800 mb-6">Daftar Menu Tersedia</h2>

                    <!-- Grid Cards -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6">

                        <!-- Card 1 -->
                        <div
                            class="bg-white rounded-xl shadow-sm border border-gray-200 hover:shadow-md transition-shadow overflow-hidden">
                            <div class="h-32 bg-amber-100 flex items-center justify-center">
                                <span class="text-4xl">🍹</span>
                            </div>
                            <div class="p-4">
                                <div class="flex justify-between items-start mb-2">
                                    <h3 class="text-lg font-bold text-gray-800">Es Teh Manis</h3>
                                    <span
                                        class="bg-blue-100 text-blue-800 text-xs font-bold px-2 py-1 rounded-md">Minuman</span>
                                </div>
                                <p class="text-gray-600 font-medium mb-4">Rp 4.000</p>
                                <div class="flex gap-2">
                                    <button
                                        class="flex-1 border border-gray-300 hover:bg-gray-50 text-gray-700 text-sm py-1.5 rounded-md font-medium transition-colors">Edit</button>
                                    <button
                                        class="flex-1 bg-red-50 hover:bg-red-100 text-red-600 text-sm py-1.5 rounded-md font-medium transition-colors">Hapus</button>
                                </div>
                            </div>
                        </div>

                        <!-- Card 2 -->
                        <div
                            class="bg-white rounded-xl shadow-sm border border-gray-200 hover:shadow-md transition-shadow overflow-hidden">
                            <div class="h-32 bg-stone-200 flex items-center justify-center">
                                <span class="text-4xl">☕</span>
                            </div>
                            <div class="p-4">
                                <div class="flex justify-between items-start mb-2">
                                    <h3 class="text-lg font-bold text-gray-800">Kopi Hitam</h3>
                                    <span
                                        class="bg-blue-100 text-blue-800 text-xs font-bold px-2 py-1 rounded-md">Minuman</span>
                                </div>
                                <p class="text-gray-600 font-medium mb-4">Rp 5.000</p>
                                <div class="flex gap-2">
                                    <button
                                        class="flex-1 border border-gray-300 hover:bg-gray-50 text-gray-700 text-sm py-1.5 rounded-md font-medium transition-colors">Edit</button>
                                    <button
                                        class="flex-1 bg-red-50 hover:bg-red-100 text-red-600 text-sm py-1.5 rounded-md font-medium transition-colors">Hapus</button>
                                </div>
                            </div>
                        </div>

                        <!-- Card 3 -->
                        <div
                            class="bg-white rounded-xl shadow-sm border border-gray-200 hover:shadow-md transition-shadow overflow-hidden">
                            <div class="h-32 bg-orange-100 flex items-center justify-center">
                                <span class="text-4xl">🍜</span>
                            </div>
                            <div class="p-4">
                                <div class="flex justify-between items-start mb-2">
                                    <h3 class="text-lg font-bold text-gray-800">Indomie Telur</h3>
                                    <span
                                        class="bg-green-100 text-green-800 text-xs font-bold px-2 py-1 rounded-md">Makanan</span>
                                </div>
                                <p class="text-gray-600 font-medium mb-4">Rp 10.000</p>
                                <div class="flex gap-2">
                                    <button
                                        class="flex-1 border border-gray-300 hover:bg-gray-50 text-gray-700 text-sm py-1.5 rounded-md font-medium transition-colors">Edit</button>
                                    <button
                                        class="flex-1 bg-red-50 hover:bg-red-100 text-red-600 text-sm py-1.5 rounded-md font-medium transition-colors">Hapus</button>
                                </div>
                            </div>
                        </div>

                        <!-- Card 4 -->
                        <div
                            class="bg-white rounded-xl shadow-sm border border-gray-200 hover:shadow-md transition-shadow overflow-hidden">
                            <div class="h-32 bg-yellow-100 flex items-center justify-center">
                                <span class="text-4xl">🍟</span>
                            </div>
                            <div class="p-4">
                                <div class="flex justify-between items-start mb-2">
                                    <h3 class="text-lg font-bold text-gray-800">Kentang Goreng</h3>
                                    <span
                                        class="bg-yellow-100 text-yellow-800 text-xs font-bold px-2 py-1 rounded-md">Cemilan</span>
                                </div>
                                <p class="text-gray-600 font-medium mb-4">Rp 12.000</p>
                                <div class="flex gap-2">
                                    <button
                                        class="flex-1 border border-gray-300 hover:bg-gray-50 text-gray-700 text-sm py-1.5 rounded-md font-medium transition-colors">Edit</button>
                                    <button
                                        class="flex-1 bg-red-50 hover:bg-red-100 text-red-600 text-sm py-1.5 rounded-md font-medium transition-colors">Hapus</button>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </main>
    </div>

</body>

</html>
